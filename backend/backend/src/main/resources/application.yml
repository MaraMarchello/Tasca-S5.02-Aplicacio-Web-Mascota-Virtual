spring:
  application:
    name: codemate
  
  datasource:
    url: jdbc:postgresql://localhost:5432/codemate
    username: postgres
    password: 78446660579
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  redis:
    host: localhost
    port: 6379
  
  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret-key-here}
      expiration: 86400000 # 24 hours
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/codemate
    user: postgres
    password: 78446660579
    clean-disabled: false
  
  cache:
    type: simple
    cache-names: codeAssistance,errorExplanations,gitErrorExplanations

  # Disable static resources for REST API
  web:
    resources:
      add-mappings: false
  
server:
  port: 8081
  
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  
logging:
  level:
    com.codemate: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
  
openai:
  api:
    key: ${OPENAI_API_KEY:your-api-key-here}
    timeout: 180
    model: ${OPENAI_MODEL:gpt-3.5-turbo}
    # Available models: gpt-3.5-turbo, gpt-4, gpt-4-turbo-preview
    # Note: gpt-4 requires special access and higher billing limits

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  
  cache:
    ttl: 3600 # 1 hour in seconds
  
  git:
    execution:
      enabled: ${GIT_REAL_EXECUTION_ENABLED:true} # Enable real Git command execution
      timeout: 30 # Command timeout in seconds
    workspace:
      base-path: ${GIT_WORKSPACE_PATH:${java.io.tmpdir}/codemate-git-workspaces}
      cleanup-hours: 24 # Clean up workspaces after this many hours
      max-size-mb: 100 # Maximum workspace size in MB
    
    # Security settings
    security:
      monitoring-enabled: true
      threat-detection-enabled: true
      auto-response-enabled: true
      max-failed-attempts: 5
      lockout-duration-minutes: 15
      assessment-interval-ms: 300000 # 5 minutes
      enable-posix-permissions: true
    
    # Rate limiting
    rate-limit:
      commands-per-minute: 30
      commands-per-hour: 500
      commands-per-day: 2000
      global-commands-per-minute: 200
      max-concurrent-commands: 10
      command-timeout-seconds: 30
    
    # Resource monitoring
    resources:
      max-cpu-percent: 80
      max-memory-percent: 70
      max-disk-percent: 85
      user-disk-quota-mb: 500
      user-memory-quota-mb: 100
      max-file-count-per-user: 1000
      monitoring-enabled: true
      monitoring-interval-ms: 30000 # 30 seconds
      cleanup-interval-ms: 3600000 # 1 hour
    
    # Session management
    session:
      max-idle-minutes: 30
      max-active-hours: 8
      cleanup-interval-minutes: 15
      max-concurrent-sessions: 5
      workspace-retention-hours: 48
      emergency-cleanup-enabled: true
      repository-lifetime-hours: 4
      max-repositories-per-user: 5
    
    # Permissions
    permissions:
      enable-strict-access: true
      demo-access-timeout-hours: 24
      shared-repository-enabled: false
    
    # Audit logging
    audit:
      enabled: true
      log-path: ${GIT_AUDIT_PATH:${java.io.tmpdir}/codemate-audit}
      log-level: INFO
      include-command-output: false
      max-log-file-size-mb: 100

    # Comprehensive cleanup settings
    cleanup:
      abandoned-session-hours: 2
      orphaned-workspace-hours: 24
      temp-files-hours: 1
      max-workspace-size-mb: 1000
      max-total-size-gb: 10
      aggressive-cleanup-enabled: true
      parallel-cleanup: true
      comprehensive-interval-minutes: 60
      quick-interval-minutes: 15 
  jwt:
    # A secure, randomly generated key for development. In production, use environment variables.
    secret: ${JWT_SECRET:04ca023b39512e46d0c2cf4b48d5aac61d34302994c87ed4eff225dcf3b0a218739f3897051a057f9b846a69ea2927a587044164b7bae5e1306219d50b588cb1}
    expiration: 86400000 # 24 hours (in milliseconds)
    generate-random-secret: ${JWT_GENERATE_RANDOM:false} # Set to true to generate a random key at startup (dev only)
    cookie:
      secure: false # Set to false for HTTP localhost development
      http-only: true # Prevent JavaScript access
      domain: ${COOKIE_DOMAIN:localhost}
      path: /
      same-site: lax # Changed from strict to lax for better compatibility
      max-age: 86400 # 24 hours (in seconds)
  oauth2:
    redirectUri: ${OAUTH2_REDIRECT_URI:http://localhost:8081/dashboard}
    authorizedRedirectUris:
      - http://localhost:8081/dashboard
      - http://localhost:8081/oauth2/redirect
      - http://localhost:8081/login 