spring:
  application:
    name: codemate
  
  datasource:
    url: jdbc:postgresql://localhost:5433/codemate
    username: postgres
    password: 78446660579
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  redis:
    host: localhost
    port: 6379
  
  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret-key-here}
      expiration: 86400000 # 24 hours
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            redirectUri: "{baseUrl}/oauth2/callback/{registrationId}"
            scope:
              - email
              - profile
          github:
            clientId: ${GITHUB_CLIENT_ID}
            clientSecret: ${GITHUB_CLIENT_SECRET}
            redirectUri: "{baseUrl}/oauth2/callback/{registrationId}"
            scope:
              - user:email
              - read:user
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5433/codemate
    user: postgres
    password: 78446660579
    clean-disabled: false
  
  cache:
    type: simple
    cache-names: codeAssistance,errorExplanations,gitErrorExplanations
  
server:
  port: 8081
  
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  
logging:
  level:
    com.codemate: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
  
openai:
  api:
    key: ${OPENAI_API_KEY:your-api-key-here}
    timeout: 180

app:
  cors:
    allowed-origins: http://localhost:8081
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  
  cache:
    ttl: 3600 # 1 hour in seconds 
  jwt:
    # A secure, randomly generated key for development. In production, use environment variables.
    secret: ${JWT_SECRET:04ca023b39512e46d0c2cf4b48d5aac61d34302994c87ed4eff225dcf3b0a218739f3897051a057f9b846a69ea2927a587044164b7bae5e1306219d50b588cb1}
    expiration: 86400000 # 24 hours (in milliseconds)
    generate-random-secret: ${JWT_GENERATE_RANDOM:false} # Set to true to generate a random key at startup (dev only)
    cookie:
      secure: true # Only send over HTTPS
      http-only: true # Prevent JavaScript access
      domain: ${COOKIE_DOMAIN:localhost}
      path: /
      same-site: strict # Prevent CSRF
      max-age: 86400 # 24 hours (in seconds)
  oauth2:
    redirectUri: ${OAUTH2_REDIRECT_URI:http://localhost:8081/dashboard}
    authorizedRedirectUris:
      - http://localhost:8081/dashboard
      - http://localhost:8081/oauth2/redirect
      - http://localhost:8081/login 